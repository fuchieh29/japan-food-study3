<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日本觀光商店街料理選擇研究｜Study 3</title><style>
:root{--ink:#243443;--muted:#627383;--teal:#236b68;--light:#e9f2f0;--border:#d9e2e7;--bg:#f5f7f7}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC','Microsoft JhengHei',sans-serif;line-height:1.75}header{background:#fff;border-bottom:1px solid var(--border);padding:18px 20px}header>div{max-width:850px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:18px}header strong{font-size:19px}header .sub{font-size:12px;color:var(--muted)}main{max-width:850px;margin:24px auto 70px;padding:0 15px}.panel{background:#fff;border:1px solid var(--border);border-radius:16px;padding:25px;margin-bottom:15px;box-shadow:0 6px 24px #102d3608}h1{font-size:25px;line-height:1.4;margin:0 0 16px}h2{font-size:20px;margin:0 0 13px}h3{font-size:17px}.hint,.small{color:var(--muted);font-size:14px}.progress{height:6px;background:#e3e9ea}.progress>div{height:6px;background:var(--teal);transition:width .2s}.question{border-bottom:1px solid #eef1f2;padding:16px 0}.question:last-child{border:0}.question.missing{background:#fff5f1;border-left:3px solid #c8533c;padding-left:12px}.qtitle{font-weight:600;margin-bottom:9px}.choices{display:flex;flex-wrap:wrap;gap:9px}.choices label{display:flex;gap:7px;align-items:center;padding:7px 12px;border:1px solid var(--border);border-radius:9px;cursor:pointer;min-height:40px}.choices input{accent-color:var(--teal)}.numeric{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.numeric label{padding:8px 0;justify-content:center;display:flex;flex-direction:column;gap:0;font-size:14px}.numeric input{margin:0 0 2px}.btn{border:0;padding:12px 23px;background:var(--teal);color:white;border-radius:10px;font-size:16px;cursor:pointer;font-weight:600}.btn.secondary{background:#e8efee;color:var(--ink)}.btn:disabled{opacity:.5;cursor:not-allowed}.buttons{display:flex;gap:10px;justify-content:space-between;margin-top:18px}.error{color:#b63727;font-weight:600;margin-top:10px}.scene{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:11px}.scenario{background:#f0f6f4;padding:16px 18px;border-left:4px solid #397e78;border-radius:7px;margin:16px 0}.foodgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.food{border:2px solid #e0e7e8;background:#fff;border-radius:12px;padding:8px;cursor:pointer;text-align:center;font-size:14px;font-family:inherit}.food.selected{border-color:var(--teal);background:#edf7f4}.food img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:7px;margin-bottom:5px}.food .selected-tag{display:none;color:var(--teal);font-weight:700}.food.selected .selected-tag{display:block}.foodname{font-weight:600}.counter{padding:10px 0;font-size:14px;color:var(--muted)}textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px;font:inherit;min-height:85px}.pill{color:#286d69;background:var(--light);font-size:13px;display:inline-block;padding:3px 10px;border-radius:100px}.footnote{font-size:12px;color:#72808a;margin-top:25px}@media(max-width:600px){header strong{font-size:16px}.panel{padding:16px}.foodgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.food{padding:5px;font-size:13px}.numeric{gap:2px}.numeric label{padding:8px 0;font-size:13px}.choices{gap:6px}.choices label{padding:7px 9px}h1{font-size:21px}}
</style></head><body><header><div><div><strong>日本觀光商店街料理選擇研究</strong><div class="sub">國立臺灣體育運動大學・運動事業管理學系</div></div><div class="sub" id="step"></div></div></header><div class="progress"><div id="bar"></div></div><main><div class="panel" id="page"></div><div class="error" id="err" role="alert"></div><div class="buttons" id="buttons"></div><div class="footnote">研究測試版本｜目前未連接正式資料庫，請勿用於正式招募。</div></main><script>
'use strict';
// Publish only after IRB approval, confirmed final consent wording, and deployed Study 3 Apps Script endpoint.
const ENDPOINT = ''; // STUDY 3 ONLY. Paste its deployed Apps Script /exec URL after testing.
const TEST_MODE = true; // Must be false for approved formal data collection.
const PID='S3-'+(crypto.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2));
const foods=[{"id":"F01","name":"鰻魚丼飯","img":"images/F01.jpg"},{"id":"F02","name":"生魚片","img":"images/F02.jpg"},{"id":"F04","name":"唐揚雞飯","img":"images/F04.jpg"},{"id":"F06","name":"日式燒烤","img":"images/F06.jpg"},{"id":"F08","name":"廣島燒","img":"images/F08.jpg"},{"id":"F09","name":"豚骨拉麵","img":"images/F09.jpg"},{"id":"F10","name":"炸和牛","img":"images/F10.jpg"},{"id":"F12","name":"海膽飯","img":"images/F12.jpg"},{"id":"F13","name":"日式煎餃","img":"images/F13.jpg"},{"id":"F14","name":"蛋包飯","img":"images/F14.jpg"},{"id":"F15","name":"壽喜燒","img":"images/F15.jpg"},{"id":"F16","name":"烏龍麵","img":"images/F16.jpg"},{"id":"F17","name":"辣味拉麵","img":"images/F17.jpg"},{"id":"F18","name":"牛丼","img":"images/F18.jpg"},{"id":"F19","name":"咖喱豬排飯","img":"images/F19.jpg"},{"id":"F20","name":"親子丼","img":"images/F20.jpg"},{"id":"F21","name":"豬排定食","img":"images/F21.jpg"},{"id":"F22","name":"天丼","img":"images/F22.jpg"},{"id":"F23","name":"狐狸烏龍麵","img":"images/F23.jpg"},{"id":"F24","name":"生魚片丼飯","img":"images/F24.jpg"},{"id":"F25","name":"豬排丼飯","img":"images/F25.jpg"},{"id":"F26","name":"柚子拉麵","img":"images/F26.jpg"},{"id":"F27","name":"卷壽司","img":"images/F27.jpg"},{"id":"F28","name":"日式烤牛排","img":"images/F28.jpg"}];
const scales={
 FF:{title:'日本料理熟悉度',items:[['FF1','整體而言，我對日本料理相當熟悉。'],['FF2','整體而言，我對日本料理具有相當程度的了解。']]},
 FNS:{title:'日常飲食傾向',items:[['FNS1','我經常嘗試新的、不同種類的食物。'],['FNS2','我不信任新奇的食物。'],['FNS5','異國料理看起來太奇怪，讓我不想吃。'],['FNS6','參加聚餐時，我願意嘗試新的食物。'],['FNS7','我害怕吃自己以前沒吃過的東西。'],['FNS10','我喜歡嘗試新開的異國料理餐廳。']]},
 OC:{title:'料理選擇後的想法',items:[['OC1','剛才選擇這道料理時，我有想到自己因此放棄了品嚐其他料理的機會。'],['OC2','剛才選擇這道料理時，我想到其他同樣值得嘗試的料理。'],['OC3','剛才決定選擇這道料理時，我考慮到今晚因此吃不到哪些其他料理。']]},
 DR:{title:'料理選擇後的感受',items:[['DR1','我對剛才選擇這道料理感到遺憾。'],['DR2','我對剛才選擇這道料理感到後悔。'],['DR3','我覺得剛才應該選擇其他料理。']]},
 DD:{title:'選擇過程感受',items:[['DD1','在剛才選擇料理的過程中，我感到不知所措。'],['DD2','在剛才選擇料理的過程中，我感到挫折。'],['DD3','在剛才選擇料理的過程中，我感到煩躁。'],['DD4','我覺得剛才要從這些料理中做出選擇很困難。']]},
 CHECK:{title:'剛才的情境',items:[['PR1','即使這次沒有選擇某些料理，我仍有機會在此次旅程中品嚐它們。'],['PR2','這次沒有選擇的料理，我在此次旅程中仍有機會再吃到。'],['MC1','剛才有太多料理可以選擇。'],['MC2','我認為剛才提供的料理選項數量很多。'],['SR1','我認為剛才描述的日本觀光商店街情境是貼近現實的。'],['SR2','我認為自己在日本旅行時，有可能遇到類似的料理選擇情境。'],['CF1','剛才的料理選項整體都很吸引我。'],['CF2','剛才做選擇時，我覺得時間很緊迫。']]},
 ATCB:{title:'對顏色的看法',items:[['ATCB1','我認為藍色是一種可愛的顏色。'],['ATCB2','我認為藍色是一種令人愉悅的顏色。'],['ATCB3','我認為藍色是一種好看的顏色。'],['ATCB4','我認為藍色是一種漂亮的顏色。']]}
};
const groupMap=[{code:'A',n:6,r:'recoverable'},{code:'B',n:6,r:'nonrecoverable'},{code:'C',n:24,r:'recoverable'},{code:'D',n:24,r:'nonrecoverable'}];
// Balanced randomization is not claimed: each browser session independently samples one of four groups.
let state={page:0,group:null,answers:{},start:new Date().toISOString(),choiceStart:null,choiceEnd:null,end:null,order:null,submitted:false,device:/Android|iPhone|iPad|Mobi/i.test(navigator.userAgent)?'mobile':'desktop'};
const steps=['研究說明','背景與飲食習慣','日本觀光商店街','選擇後的感受','情境檢核','其他題目','完成'];
const $=id=>document.getElementById(id);
const esc=x=>String(x).replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
const shuffled=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const selectGroup=()=>{let q=new URLSearchParams(location.search);let override=TEST_MODE?q.get('testgroup'):null;let match=groupMap.find(g=>g.code===override);return match||groupMap[Math.floor(Math.random()*4)]};
function question(id,label,options){return `<div class="question" data-question="${id}"><div class="qtitle">${esc(label)}</div><div class="choices ${options.length===7?'numeric':''}">${options.map(([value,text])=>`<label><input type="radio" name="${id}" value="${esc(value)}" ${state.answers[id]===String(value)?'checked':''}><span>${esc(text)}</span></label>`).join('')}</div></div>`}
function likert(items){return `<div class="hint">1＝非常不同意，7＝非常同意</div>`+items.map(([id,txt])=>question(id,txt,Array.from({length:7},(_,i)=>[i+1,i+1]))).join('')}
function chooseFood(id){state.answers.Q1=id;render()}
function render(){ $('step').textContent=`${state.page+1} / ${steps.length}`;$('bar').style.width=`${100*(state.page+1)/steps.length}%`;$('err').textContent='';let c='',btn='';
if(state.page===0)c=`<h1>研究說明與參與同意</h1><p>本研究探討日本旅遊情境下的料理選擇與個人感受。參與自願，您可隨時退出。本研究目前為測試版本，不收集正式研究資料。</p><p class="small">研究單位：國立臺灣體育運動大學運動事業管理學系<br>研究者：徐輔潔<br>聯絡信箱：fuchieh29@ntus.edu.tw</p><p class="small"><b>正式收案前必須以 IRB 核准的完整知情同意書取代本段測試說明。</b></p>${question('CONSENT','您是否同意參與測試？',[['yes','同意'],['no','不同意']])}${question('S1','您是否年滿18歲？',[['yes','是'],['no','否']])}${question('S2','您目前是否居住於臺灣？',[['yes','是'],['no','否']])}`;
if(state.page===1)c=`<h1>個人背景與日常飲食習慣</h1><p class="hint">請依您平常的實際經驗回答。</p>${likert(scales.FF.items)}<h2>日常飲食傾向</h2>${likert(scales.FNS.items)}${question('TE1','您是否曾經前往日本旅遊？',[['yes','有'],['no','沒有']])}`;
if(state.page===2){if(!state.group){state.group=selectGroup();let ids=state.group.n===6?['F01','F06','F14','F18','F23','F26']:foods.map(x=>x.id);state.order=shuffled(ids);state.choiceStart=new Date().toISOString()}const r=state.group.r==='recoverable';const scena=r?'這次用餐結束後，您在此次日本旅程中仍有機會再次回到這條商店街，現在提供的料理屆時也仍會供應。因此，即使這次沒有選擇某些料理，您在此次旅程中仍有機會品嚐它們。':'這次用餐結束後，您在此次日本旅程中不會再回到這條商店街，而且現在提供的料理在接下來的行程中無法取得。因此，這次沒有選擇的料理，您在此次旅程中將無法再品嚐。';c=`<h1>日本觀光商店街的料理選擇</h1><img class="scene" src="street.jpg" alt="日本觀光商店街的示意場景"><p>請想像您正在日本自由行，來到一條聚集許多餐飲店的觀光商店街。現在是晚餐時間，您準備在這裡選擇一道日本料理作為這次的正餐。</p><p>本次用餐您只能選擇一道料理。所有料理的價格均在您的預算內，且目前都有供應。</p><div class="scenario"><b>此次旅程的用餐安排</b><p>${scena}</p></div><h2>請從下列 ${state.group.n} 道料理選擇最想吃的一道</h2><div class="foodgrid">${state.order.map(id=>{let f=foods.find(x=>x.id===id);let chosen=state.answers.Q1===id;return `<button type="button" class="food ${chosen?'selected':''}" data-food="${id}" aria-pressed="${chosen}"><img src="${f.img}" alt="${esc(f.name)}" loading="lazy"><span class="foodname">${esc(f.name)}</span><span class="selected-tag">✓ 已選擇</span></button>`}).join('')}</div><div class="counter">${state.answers.Q1?'已選擇 '+esc(foods.find(f=>f.id===state.answers.Q1).name):'請選擇一道料理'}</div>`}
if(state.page===3)c='<h1>料理選擇後的感受</h1><p>請根據剛才選擇料理的過程與感受回答。</p><h2>選擇過程</h2>'+likert(scales.DD.items)+'<h2>選擇時的想法</h2>'+likert(scales.OC.items)+'<h2>選擇後的感受</h2>'+likert(scales.DR.items);
if(state.page===4)c='<h1>剛才的情境</h1><p>請根據您剛才閱讀的旅程安排與料理選擇回答。</p>'+likert(scales.CHECK.items)+question('AC2','為確認您有仔細閱讀問卷，請在本題選擇「非常不同意」（1）。',Array.from({length:7},(_,i)=>[i+1,i+1]));
if(state.page===5)c='<h1>其他題目與基本資料</h1>'+likert(scales.ATCB.items)+question('B1','您的性別？',[['female','女性'],['male','男性'],['other','其他'],['skip','不願透露']])+question('B2','您的年齡？',[['18-24','18–24歲'],['25-34','25–34歲'],['35-44','35–44歲'],['45-54','45–54歲'],['55+','55歲以上']])+question('B3','您的最高教育程度？',[['high','高中職（含）以下'],['college','專科／大學'],['master','碩士'],['phd','博士']]);
if(state.page===6)c=`<h1>問卷已完成</h1><p>感謝您完成 Study 3 測試。</p><p class="small">目前為研究測試版，未連接 Google Sheets，答案不會自動寫入任何正式資料庫。</p><button class="btn" type="button" id="export">下載這次測試資料（CSV）</button><p id="submit-status" class="hint"></p>`;
$('page').innerHTML=c;
if(state.page===2)$('page').querySelectorAll('[data-food]').forEach(b=>b.addEventListener('click',()=>chooseFood(b.dataset.food)));
if(state.page===6){$('export').onclick=downloadCSV;if(!TEST_MODE&&ENDPOINT&&!state.submitted)submit();}
$('buttons').innerHTML=state.page===6?'':`<button type="button" id="back" class="btn secondary" ${state.page===0?'disabled':''}>上一步</button><button type="button" id="next" class="btn">${state.page===5?'完成問卷':'下一步'}</button>`;
if(state.page<6){$('back').onclick=()=>{readVisible();state.page--;render();window.scrollTo(0,0)};$('next').onclick=next;}
}
function readVisible(){document.querySelectorAll('input[type=radio]:checked').forEach(x=>state.answers[x.name]=x.value)}
function needed(){if(state.page===0)return ['CONSENT','S1','S2'];if(state.page===1)return [...scales.FF.items,...scales.FNS.items].map(x=>x[0]).concat('TE1');if(state.page===2)return ['Q1'];if(state.page===3)return [...scales.DD.items,...scales.OC.items,...scales.DR.items].map(x=>x[0]);if(state.page===4)return scales.CHECK.items.map(x=>x[0]).concat('AC2');if(state.page===5)return scales.ATCB.items.map(x=>x[0]).concat('B1','B2','B3');return []}
function next(){readVisible();let missing=needed().filter(x=>!state.answers[x]);if(missing.length){$('err').textContent=`尚有 ${missing.length} 題未完成。`;document.querySelectorAll('.question').forEach(x=>x.classList.toggle('missing',missing.includes(x.dataset.question)));document.querySelector('.missing')?.scrollIntoView({block:'center',behavior:'smooth'});return}
if(state.page===0&&(state.answers.CONSENT!=='yes'||state.answers.S1!=='yes'||state.answers.S2!=='yes')){$('page').innerHTML='<h2>感謝您的時間</h2><p>您未同意參與或不符合參與條件，問卷到此結束。</p>';$('buttons').innerHTML='';return}
if(state.page===2)state.choiceEnd=new Date().toISOString();if(state.page===5)state.end=new Date().toISOString();state.page++;render();window.scrollTo(0,0)}
function record(){const a=state.answers;let row={participant_id:PID,study:'3',start_time:state.start,end_time:state.end,choice_start:state.choiceStart,choice_end:state.choiceEnd,group:state.group?.code||'',choice_set_size:state.group?.n||'',recoverability:state.group?.r||'',food_order:(state.order||[]).join('|'),chosen_food_id:a.Q1||'',chosen_food_name:foods.find(f=>f.id===a.Q1)?.name||'',device:state.device,...a};row.FNS1_R=a.FNS1?8-Number(a.FNS1):'';row.FNS6_R=a.FNS6?8-Number(a.FNS6):'';row.FNS10_R=a.FNS10?8-Number(a.FNS10):'';row.AC2_pass=a.AC2==='1'?1:0;return row}
function downloadCSV(){const r=record(),keys=Object.keys(r),q=x=>'"'+String(x??'').replaceAll('"','""')+'"',csv='\ufeff'+keys.map(q).join(',')+'\r\n'+keys.map(k=>q(r[k])).join(',');let a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='Study3_test_'+(state.group?.code||'unknown')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function submit(){state.submitted=true;const out=$('submit-status');out.textContent='傳送資料中…';try{let body=new URLSearchParams();body.set('payload',JSON.stringify(record()));await fetch(ENDPOINT,{method:'POST',mode:'no-cors',body});out.textContent='傳送請求已送出。研究者仍須核對 Google Sheets 實際寫入情況。'}catch(e){state.submitted=false;out.textContent='傳送失敗，請聯絡研究者。'}}
render();
</script></body></html>
